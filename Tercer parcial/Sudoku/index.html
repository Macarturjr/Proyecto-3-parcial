<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sudoku Pro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body { background: #f4f6f9; }

.sudoku-grid {
  display: grid;
  grid-template-columns: repeat(9, 45px);
  gap: 3px;
  justify-content: center;
}

.cell {
  width: 45px;
  height: 45px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.fixed {
  background: #e9ecef;
}

.invalid {
  background: #ffcccc;
}
</style>
</head>

<body class="text-center p-4">

<h1>🧩 Sudoku Pro</h1>

<p>
El Sudoku es un rompecabezas lógico donde debes completar una cuadrícula 9x9 con números del 1 al 9 sin repetir en filas, columnas ni bloques 3x3.
</p>

<div class="mb-3">
<select id="difficulty" class="form-select w-25 mx-auto">
<option value="35">Fácil</option>
<option value="45">Medio</option>
<option value="55">Difícil</option>
</select>
</div>

<div class="mb-3">
<button class="btn btn-primary" onclick="startGame()">Iniciar</button>
<button class="btn btn-warning" onclick="giveHint()">Pista</button>
<button class="btn btn-success" onclick="finishGame()">Finalizar</button>
</div>

<h4>⏱ Tiempo: <span id="timer">0</span>s</h4>

<div id="grid" class="sudoku-grid mt-4"></div>

<script>
let solution = [];
let puzzle = [];
let seconds = 0;
let timerInterval;

function startTimer() {
  clearInterval(timerInterval);
  seconds = 0;
  timerInterval = setInterval(() => {
    seconds++;
    document.getElementById("timer").textContent = seconds;
  }, 1000);
}

// Generador Sudoku válido (backtracking)
function generateSudoku() {
  let board = Array(9).fill().map(() => Array(9).fill(0));

  function isSafe(b, r, c, num) {
    for (let x = 0; x < 9; x++) {
      if (b[r][x] === num || b[x][c] === num) return false;
    }

    let startRow = r - r % 3;
    let startCol = c - c % 3;

    for (let i = 0; i < 3; i++)
      for (let j = 0; j < 3; j++)
        if (b[i + startRow][j + startCol] === num) return false;

    return true;
  }

  function solve(b) {
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        if (b[r][c] === 0) {
          let nums = [...Array(9).keys()].map(n => n+1).sort(() => Math.random()-0.5);
          for (let num of nums) {
            if (isSafe(b, r, c, num)) {
              b[r][c] = num;
              if (solve(b)) return true;
              b[r][c] = 0;
            }
          }
          return false;
        }
      }
    }
    return true;
  }

  solve(board);
  return board;
}

function createPuzzle(full, difficulty) {
  let p = full.map(row => [...row]);

  let attempts = difficulty;
  while (attempts > 0) {
    let r = Math.floor(Math.random() * 9);
    let c = Math.floor(Math.random() * 9);

    if (p[r][c] !== 0) {
      p[r][c] = 0;
      attempts--;
    }
  }
  return p;
}

function drawGrid() {
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {

      let input = document.createElement("input");
      input.className = "cell form-control";

      if (puzzle[r][c] !== 0) {
        input.value = puzzle[r][c];
        input.disabled = true;
        input.classList.add("fixed");
      } else {
        input.dataset.row = r;
        input.dataset.col = c;

        input.addEventListener("input", validateMove);
      }

      grid.appendChild(input);
    }
  }
}

function validateMove(e) {
  let input = e.target;
  let r = input.dataset.row;
  let c = input.dataset.col;

  if (input.value == solution[r][c]) {
    input.classList.remove("invalid");
  } else {
    input.classList.add("invalid");
  }
}

function startGame() {
  solution = generateSudoku();
  let difficulty = parseInt(document.getElementById("difficulty").value);
  puzzle = createPuzzle(solution, difficulty);

  drawGrid();
  startTimer();

  localStorage.setItem("sudoku_game", JSON.stringify(puzzle));
}

function giveHint() {
  let inputs = document.querySelectorAll(".cell");

  for (let input of inputs) {
    if (!input.disabled && input.value == "") {
      let r = input.dataset.row;
      let c = input.dataset.col;
      input.value = solution[r][c];
      return;
    }
  }
}

function finishGame() {
  clearInterval(timerInterval);

  let correct = true;
  let inputs = document.querySelectorAll(".cell");

  inputs.forEach(input => {
    if (!input.disabled) {
      let r = input.dataset.row;
      let c = input.dataset.col;

      if (parseInt(input.value) !== solution[r][c]) {
        correct = false;
      }
    }
  });

  Swal.fire({
    title: correct ? "🎉 ¡Correcto!" : "❌ Incorrecto",
    text: "Tiempo: " + seconds + " segundos",
    icon: correct ? "success" : "error"
  });
}

</script>

</body>
</html>
