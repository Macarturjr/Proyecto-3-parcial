<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sopa de Letras - Animales</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body { background:#198754; color:white; text-align:center; }

.grid {
  display:grid;
  justify-content:center;
  gap:4px;
  margin:20px;
}

.cell {
  width:35px; height:35px;
  background:white; color:black;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; user-select:none;
  border-radius:4px;
  font-weight:bold;
}

.selected { background:yellow; }
.found { background:limegreen; color:white; }
</style>
</head>

<body>

<div class="container py-4">
<h1>🐾 Sopa de Letras - Animales</h1>

<select id="difficulty" class="form-select w-50 mx-auto mb-3">
  <option value="easy">Fácil</option>
  <option value="medium">Medio</option>
  <option value="hard">Difícil</option>
</select>

<h4 id="timer">Tiempo: 0s</h4>

<button class="btn btn-success m-2" onclick="startGame()">Iniciar</button>
<button class="btn btn-danger m-2" onclick="endGame()">Finalizar</button>

<div id="grid" class="grid"></div>

<h4>Palabras:</h4>
<ul id="wordList" class="list-group w-50 mx-auto"></ul>

<h4 class="mt-4">🏆 Récord</h4>
<p id="record">--</p>

</div>

<script>
const animalPool = [
"GATO","PERRO","LEON","TIGRE","ELEFANTE","JIRAFA","CEBRA","OSO",
"MONO","LOBO","ZORRO","CONEJO","RATON","CABALLO","VACA","CERDO"
];

let words = [];
let grid = [];
let gridSize = 10;
let selected = [];
let isMouseDown = false;
let foundWords = [];
let timer = 0;
let interval;

// 🔥 GUARDAR PARTIDA
function saveGame(){
  const data = {
    grid,
    words,
    foundWords,
    timer,
    gridSize,
    difficulty: document.getElementById("difficulty").value
  };
  localStorage.setItem("sopa_letras_save", JSON.stringify(data));
}

// 🔥 CARGAR PARTIDA
function loadGame(){
  const data = JSON.parse(localStorage.getItem("sopa_letras_save"));
  if(!data) return false;

  grid = data.grid;
  words = data.words;
  foundWords = data.foundWords;
  timer = data.timer;
  gridSize = data.gridSize;

  document.getElementById("difficulty").value = data.difficulty;
  document.getElementById("grid").style.gridTemplateColumns = `repeat(${gridSize},35px)`;

  renderGrid();
  renderWords();

  foundWords.forEach(w=>{
    document.getElementById("word-"+w).style.textDecoration="line-through";
  });

  clearInterval(interval);
  interval=setInterval(()=>{
    timer++;
    document.getElementById("timer").innerText="Tiempo: "+timer+"s";
    saveGame();
  },1000);

  document.getElementById("timer").innerText="Tiempo: "+timer+"s";

  return true;
}

function setDifficulty() {
  let diff = document.getElementById("difficulty").value;

  if (diff === "easy") { gridSize = 8; words = getRandomWords(4); }
  if (diff === "medium") { gridSize = 10; words = getRandomWords(6); }
  if (diff === "hard") { gridSize = 14; words = getRandomWords(8); }

  document.getElementById("grid").style.gridTemplateColumns = `repeat(${gridSize},35px)`;
}

function getRandomWords(n) {
  return [...animalPool].sort(() => 0.5 - Math.random()).slice(0,n);
}

function createGrid() {
  grid = Array.from({length:gridSize},()=>Array(gridSize).fill(""));
}

function placeWord(word) {
  const dirs = [[0,1],[1,0],[1,1],[-1,1]];
  let placed=false;

  while(!placed) {
    let [dr,dc] = dirs[Math.floor(Math.random()*dirs.length)];
    let r = Math.floor(Math.random()*gridSize);
    let c = Math.floor(Math.random()*gridSize);

    let fits=true;

    for(let i=0;i<word.length;i++){
      let nr=r+dr*i, nc=c+dc*i;
      if(nr<0||nc<0||nr>=gridSize||nc>=gridSize ||
        (grid[nr][nc]!=="" && grid[nr][nc]!==word[i])){
        fits=false; break;
      }
    }

    if(fits){
      for(let i=0;i<word.length;i++){
        grid[r+dr*i][c+dc*i]=word[i];
      }
      placed=true;
    }
  }
}

function fillGrid(){
  const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(let r=0;r<gridSize;r++){
    for(let c=0;c<gridSize;c++){
      if(grid[r][c]===""){
        grid[r][c]=letters[Math.floor(Math.random()*letters.length)];
      }
    }
  }
}

function renderGrid(){
  const g=document.getElementById("grid");
  g.innerHTML="";

  grid.forEach((row,r)=>{
    row.forEach((cell,c)=>{
      let div=document.createElement("div");
      div.className="cell";
      div.innerText=cell;

      div.onmousedown=()=>startSelection(div,r,c);
      div.onmouseover=()=>dragSelection(div,r,c);

      g.appendChild(div);
    });
  });

  document.body.onmouseup=stopSelection;
}

function renderWords(){
  let list=document.getElementById("wordList");
  list.innerHTML="";
  words.forEach(w=>{
    let li=document.createElement("li");
    li.className="list-group-item";
    li.innerText=w;
    li.id="word-"+w;
    list.appendChild(li);
  });
}

function startSelection(div,r,c){
  isMouseDown=true;
  clearSelection();
  addCell(div,r,c);
}

function dragSelection(div,r,c){
  if(isMouseDown){
    addCell(div,r,c);
  }
}

function stopSelection(){
  if(isMouseDown){
    checkWord();
    isMouseDown=false;
  }
}

function addCell(div,r,c){
  if(!selected.find(x=>x.r===r && x.c===c)){
    div.classList.add("selected");
    selected.push({div,letter:grid[r][c],r,c});
  }
}

function clearSelection(){
  selected.forEach(c=>c.div.classList.remove("selected"));
  selected=[];
}

function checkWord(){
  let word = selected.map(c=>c.letter).join("");
  let rev = word.split("").reverse().join("");

  let found = words.find(w=>w===word || w===rev);

  if(found && !foundWords.includes(found)){
    selected.forEach(c=>{
      c.div.classList.remove("selected");
      c.div.classList.add("found");
    });

    foundWords.push(found);
    document.getElementById("word-"+found).style.textDecoration="line-through";

    saveGame(); // 🔥 guardar progreso

    if(foundWords.length===words.length){
      endGame();
    }
  } else {
    clearSelection();
  }
}

function startGame(){
  setDifficulty();
  createGrid();
  words.forEach(placeWord);
  fillGrid();
  renderGrid();
  renderWords();

  foundWords=[];
  timer=0;

  clearInterval(interval);
  interval=setInterval(()=>{
    timer++;
    document.getElementById("timer").innerText="Tiempo: "+timer+"s";
    saveGame(); // 🔥 guardado automático
  },1000);

  loadRecord();
}

function endGame(){
  clearInterval(interval);

  saveRecord();
  localStorage.removeItem("sopa_letras_save"); // 🔥 borrar partida

  Swal.fire({
    title:"Resultado 🐾",
    html:`Tiempo: ${timer}s<br>Encontradas: ${foundWords.length}/${words.length}`,
    icon:"success"
  });
}

function saveRecord(){
  let best = localStorage.getItem("record");
  if(!best || timer < best){
    localStorage.setItem("record", timer);
  }
}

function loadRecord(){
  let best = localStorage.getItem("record");
  document.getElementById("record").innerText = best ? best + "s" : "--";
}

// 🔥 AUTO-CARGAR AL ABRIR
window.onload = () => {
  let loaded = loadGame();
  if(!loaded){
    loadRecord();
  }
};
</script>

</body>
</html>
