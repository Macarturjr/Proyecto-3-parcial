<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CruciMaster - Generador Dinámico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --cell-size: 32px; }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .grid-wrapper { overflow: auto; padding: 20px; background: #34495e; border-radius: 8px; }
        
        #crossword-container {
            display: grid;
            gap: 1px;
            background-color: #2c3e50;
            border: 2px solid #2c3e50;
            margin: 0 auto;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: #fff;
            position: relative;
        }

        .cell.black { background-color: #2c3e50; }
        
        .cell input {
            width: 100%; height: 100%; border: none;
            text-align: center; text-transform: uppercase;
            font-weight: bold; font-size: 0.9rem; background: transparent;
            outline: none; padding: 0;
        }

        .cell-num {
            position: absolute; top: 0; left: 1px;
            font-size: 0.6rem; color: #7f8c8d; font-weight: bold; z-index: 5;
        }

        .is-correct { background-color: #d4edda !important; }
        .is-wrong { background-color: #f8d7da !important; }
        
        .clue-box { max-height: 400px; overflow-y: auto; background: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary shadow mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold">🧩 CruciMaster <small id="status" class="fw-light ms-2"></small></span>
        <div id="timer" class="text-white fw-bold fs-5">00:00</div>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="row">
        <div class="col-md-3">
            <div class="card shadow-sm border-0 mb-3">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">⚙️ Configuración</h6>
                    <select id="topic" class="form-select mb-2">
                        <option value="animales">🐾 Animales</option>
                        <option value="videojuegos">🎮 Videojuegos</option>
                        <option value="comida">🍕 Comida</option>
                    </select>
                    <select id="difficulty" class="form-select mb-3">
                        <option value="5">Fácil (5 palabras)</option>
                        <option value="10">Normal (10 palabras)</option>
                        <option value="15">Difícil (15 palabras)</option>
                    </select>
                    <div class="d-grid gap-2">
                        <button class="btn btn-primary fw-bold" onclick="generateNewGame()">NUEVA RONDA</button>
                        <button class="btn btn-success" onclick="validate()">VERIFICAR</button>
                    </div>
                </div>
            </div>
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">📖 Pistas</div>
                <div class="card-body clue-box p-3" id="clues-container"></div>
            </div>
        </div>

        <div class="col-md-9 text-center">
            <div class="grid-wrapper shadow shadow-lg">
                <div id="crossword-container"></div>
            </div>
            <div id="feedback" class="mt-3"></div>
        </div>
    </div>
</div>

<script>
    const dictionary = {
        animales: [
            {w: "PERRO", c: "Mascota que ladra"}, {w: "GATO", c: "Mascota que maúlla"},
            {w: "RATON", c: "Le gusta el queso"}, {w: "LORO", c: "Ave parlanchina"},
            {w: "TIGRE", c: "Felino a rayas"}, {w: "LEON", c: "Rey de la selva"},
            {w: "JIRAFA", c: "Cuello muy largo"}, {w: "CEBRA", c: "Caballo con rayas"},
            {w: "ELEFANTE", c: "Tiene trompa"}, {w: "MONO", c: "Come bananas"},
            {w: "AGUILA", c: "Vuela muy alto"}, {w: "DELFIN", c: "Mamífero marino listo"},
            {w: "SERPIENTE", c: "Reptil sin patas"}, {w: "OSO", c: "Le gusta la miel"},
            {w: "LOBO", c: "Aúlla a la luna"}, {w: "VACA", c: "Nos da leche"}
        ],
        videojuegos: [
            {w: "MARIO", c: "Fontanero de rojo"}, {w: "ZELDA", c: "Princesa de Hyrule"},
            {w: "SONIC", c: "Erizo muy rápido"}, {w: "PACMAN", c: "Come bolitas"},
            {w: "TETRIS", c: "Juego de bloques"}, {w: "HALO", c: "Master Chief"},
            {w: "DOOM", c: "Shooter infernal"}, {w: "KIRBY", c: "Bola rosa que vuela"},
            {w: "FORTNITE", c: "Battle Royale famoso"}, {w: "MINECRAFT", c: "Mundo de cubos"},
            {w: "POKEMON", c: "Atrapalos a todos"}, {w: "KRATOS", c: "Dios de la guerra"},
            {w: "LINK", c: "Héroe del tiempo"}, {w: "CHUNLI", c: "Luchadora de Street Fighter"},
            {w: "BOWSER", c: "Enemigo de Mario"}
        ],
        comida: [
            {w: "PIZZA", c: "De Italia con queso"}, {w: "TACO", c: "Delicia mexicana"},
            {w: "PASTA", c: "Espagueti o penne"}, {w: "HAMBURGUESA", c: "Carne entre panes"},
            {w: "ARROZ", c: "Grano blanco"}, {w: "SOPA", c: "Líquido caliente"},
            {w: "SUSHI", c: "Pescado crudo y arroz"}, {w: "HELADO", c: "Postre frío"},
            {w: "DONA", c: "Pan con agujero"}, {w: "QUESO", c: "Viene de la leche"},
            {w: "MANZANA", c: "Fruta de Blanca Nieves"}, {w: "POLLO", c: "Ave frita o asada"},
            {w: "PAN", c: "Harina y levadura"}, {w: "CHOCOLATE", c: "Dulce de cacao"},
            {w: "ENSALADA", c: "Muchos vegetales"}
        ]
    };

    let timer;
    let seconds = 0;
    const GRID_SIZE = 15;

    function generateNewGame() {
        const topic = document.getElementById('topic').value;
        const count = parseInt(document.getElementById('difficulty').value);
        
        // Mezclar y seleccionar palabras aleatorias
        let words = [...dictionary[topic]].sort(() => Math.random() - 0.5).slice(0, count);
        
        // Intentar construir el tablero dinámicamente
        const result = buildBoard(words);
        
        if (result) {
            render(result);
            startTimer();
        } else {
            // Si el algoritmo falla por falta de cruces, reintentar
            generateNewGame();
        }
    }

    function buildBoard(words) {
        let grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(null));
        let placed = [];

        // 1. Colocar la primera palabra en el centro
        let first = words[0];
        let startCol = Math.floor((GRID_SIZE - first.w.length) / 2);
        placeWord(grid, first.w, 7, startCol, 'H', 1, first.c, placed);

        // 2. Intentar colocar el resto buscando cruces
        for (let i = 1; i < words.length; i++) {
            let word = words[i].w;
            let clue = words[i].c;
            let found = false;

            // Buscar una letra común con las ya colocadas
            for (let p of placed) {
                for (let j = 0; j < p.word.length; j++) {
                    for (let k = 0; k < word.length; k++) {
                        if (p.word[j] === word[k]) {
                            let newDir = p.dir === 'H' ? 'V' : 'H';
                            let newRow = newDir === 'V' ? p.row - k : p.row + j;
                            let newCol = newDir === 'V' ? p.col + j : p.col - k;

                            if (canPlace(grid, word, newRow, newCol, newDir)) {
                                placeWord(grid, word, newRow, newCol, newDir, i + 1, clue, placed);
                                found = true;
                                break;
                            }
                        }
                    }
                    if (found) break;
                }
                if (found) break;
            }
        }
        return placed.length > 2 ? {grid, placed} : null;
    }

    function canPlace(grid, word, r, c, dir) {
        if (r < 0 || c < 0 || r >= GRID_SIZE || c >= GRID_SIZE) return false;
        if (dir === 'H' && c + word.length > GRID_SIZE) return false;
        if (dir === 'V' && r + word.length > GRID_SIZE) return false;

        for (let i = 0; i < word.length; i++) {
            let currR = dir === 'H' ? r : r + i;
            let currC = dir === 'H' ? c + i : c;
            let cell = grid[currR][currC];
            if (cell && cell.char !== word[i]) return false;
        }
        return true;
    }

    function placeWord(grid, word, r, c, dir, num, clue, placed) {
        for (let i = 0; i < word.length; i++) {
            let currR = dir === 'H' ? r : r + i;
            let currC = dir === 'H' ? c + i : c;
            if (!grid[currR][currC]) {
                grid[currR][currC] = { char: word[i], num: i === 0 ? num : null };
            } else if (i === 0) {
                grid[currR][currC].num = num;
            }
        }
        placed.push({word, row: r, col: c, dir, clue, num});
    }

    function render(data) {
        const container = document.getElementById('crossword-container');
        const cluesContainer = document.getElementById('clues-container');
        container.style.gridTemplateColumns = `repeat(${GRID_SIZE}, var(--cell-size))`;
        container.innerHTML = '';
        
        let hHtml = '<strong>Horizontales</strong><ul class="small">';
        let vHtml = '<strong>Verticales</strong><ul class="small">';

        data.placed.forEach(p => {
            if (p.dir === 'H') hHtml += `<li>${p.num}. ${p.clue}</li>`;
            else vHtml += `<li>${p.num}. ${p.clue}</li>`;
        });
        cluesContainer.innerHTML = hHtml + '</ul>' + vHtml + '</ul>';

        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const cellData = data.grid[r][c];
                const div = document.createElement('div');
                div.className = 'cell ' + (cellData ? '' : 'black');
                
                if (cellData) {
                    if (cellData.num) div.innerHTML += `<span class="cell-num">${cellData.num}</span>`;
                    const input = document.createElement('input');
                    input.maxLength = 1;
                    input.dataset.ans = cellData.char;
                    div.appendChild(input);
                }
                container.appendChild(div);
            }
        }
    }

    function validate() {
        const inputs = document.querySelectorAll('.cell input');
        let win = true;
        inputs.forEach(i => {
            if (i.value.toUpperCase() === i.dataset.ans) i.classList.add('is-correct');
            else { i.classList.add('is-wrong'); win = false; }
        });
        if (win) clearInterval(timer);
    }

    function startTimer() {
        clearInterval(timer);
        seconds = 0;
        timer = setInterval(() => {
            seconds++;
            const m = Math.floor(seconds/60).toString().padStart(2, '0');
            const s = (seconds%60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }, 1000);
    }

    window.onload = generateNewGame;
</script>
</body>
</html>
